Page:
  name: page
  in: query
  required: false
  description: Zero-based page index. A page after the last is an empty 200.
  schema:
    type: integer
    format: int32
    minimum: 0
    default: 0

Size:
  name: size
  in: query
  required: false
  description: Page size.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 20
