CorrelationId:
  name: X-Correlation-Id
  in: header
  required: false
  description: >-
    Optional client-supplied correlation id for this request. If omitted, the
    server generates one and returns it in the response.
  schema:
    type: string
    format: uuid

Page:
  name: page
  in: query
  required: false
  description: Zero-based page index.
  schema:
    type: integer
    minimum: 0
    default: 0

Size:
  name: size
  in: query
  required: false
  description: Page size. Bounded between 1 and 100 (inclusive).
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
