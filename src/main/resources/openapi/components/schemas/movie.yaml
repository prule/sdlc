Genre:
  type: string
  enum:
    - Action
    - Adventure
    - Animation
    - Comedy
    - Crime
    - Documentary
    - Drama
    - Family
    - Fantasy
    - History
    - Horror
    - Music
    - Mystery
    - Romance
    - SciFi
    - Thriller
    - War
    - Western

MovieDetail:
  type: object
  required: [id, title, releaseYear, genres, _links]
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    releaseYear:
      type: integer
    genres:
      type: array
      minItems: 1
      items:
        $ref: '#/Genre'
    runtimeMinutes:
      type: integer
      minimum: 1
    synopsis:
      type: string
    rating:
      type: number
      minimum: 0
      maximum: 5
    _links:
      $ref: '../../openapi.yaml#/components/schemas/MovieLinks'

MovieDetailData:
  $ref: '#/MovieDetail'

MovieDetailEnvelope:
  type: object
  required: [data, meta]
  properties:
    data:
      $ref: '#/MovieDetailData'
    meta:
      $ref: '../../openapi.yaml#/components/schemas/Meta'

MovieSummary:
  type: object
  required: [id, title, releaseYear, genres, _links]
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    releaseYear:
      type: integer
    genres:
      type: array
      minItems: 1
      items:
        $ref: '#/Genre'
    runtimeMinutes:
      type: integer
      minimum: 1
    rating:
      type: number
      minimum: 0
      maximum: 5
    _links:
      $ref: '../../openapi.yaml#/components/schemas/MovieLinks'

MovieSummaryCollectionData:
  type: object
  required: [_embedded, _links]
  properties:
    _embedded:
      type: object
      required: [movies]
      properties:
        movies:
          type: array
          items:
            $ref: '#/MovieSummary'
    _links:
      $ref: '../../openapi.yaml#/components/schemas/MovieCollectionLinks'

MovieSummaryCollectionEnvelope:
  type: object
  required: [data, meta]
  properties:
    data:
      $ref: '#/MovieSummaryCollectionData'
    meta:
      $ref: '../../openapi.yaml#/components/schemas/Meta'

CreditPerson:
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string

CastCredit:
  type: object
  required: [person, billingOrder]
  properties:
    person:
      $ref: '#/CreditPerson'
    character:
      type: string
    billingOrder:
      type: integer
      minimum: 1

CrewCredit:
  type: object
  required: [person, department, job]
  properties:
    person:
      $ref: '#/CreditPerson'
    department:
      type: string
    job:
      type: string

MovieCreditsData:
  type: object
  required: [_embedded, _links]
  properties:
    _embedded:
      type: object
      required: [cast, crew]
      properties:
        cast:
          type: array
          items:
            $ref: '#/CastCredit'
        crew:
          type: array
          items:
            $ref: '#/CrewCredit'
    _links:
      $ref: '../../openapi.yaml#/components/schemas/CreditsLinks'

MovieCreditsEnvelope:
  type: object
  required: [data, meta]
  properties:
    data:
      $ref: '#/MovieCreditsData'
    meta:
      $ref: '../../openapi.yaml#/components/schemas/Meta'
