MovieDetail:
  type: object
  required: [id, title, releaseYear, genres, _links]
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    releaseYear:
      type: integer
    genres:
      type: array
      minItems: 1
      items:
        type: string
    runtimeMinutes:
      type: integer
    synopsis:
      type: string
    rating:
      type: number
      minimum: 0
      maximum: 5
    _links:
      $ref: '../../openapi.yaml#/components/schemas/MovieLinks'

MovieDetailEnvelope:
  type: object
  required: [data, meta]
  properties:
    data:
      $ref: '#/MovieDetail'
    meta:
      $ref: '../../openapi.yaml#/components/schemas/Meta'

MovieSummary:
  type: object
  required: [id, title, releaseYear, genres, _links]
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    releaseYear:
      type: integer
    genres:
      type: array
      minItems: 1
      items:
        type: string
    runtimeMinutes:
      type: integer
    rating:
      type: number
      minimum: 0
      maximum: 5
    _links:
      $ref: '../../openapi.yaml#/components/schemas/MovieSummaryLinks'

MovieCollectionData:
  type: object
  required: [_embedded, _links]
  properties:
    _embedded:
      type: object
      required: [movies]
      properties:
        movies:
          type: array
          items:
            $ref: '#/MovieSummary'
    _links:
      $ref: '../../openapi.yaml#/components/schemas/MovieCollectionLinks'

MovieCollectionEnvelope:
  type: object
  required: [data, meta]
  properties:
    data:
      $ref: '#/MovieCollectionData'
    meta:
      $ref: '../../openapi.yaml#/components/schemas/Meta'
