MovieEnvelope:
  type: object
  required: [data, meta]
  additionalProperties: false
  properties:
    data:
      $ref: '#/MovieDetail'
    meta:
      $ref: './common.yaml#/Meta'

MovieDetail:
  type: object
  required: [id, title, releaseYear, genres, _links]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
      minLength: 1
    releaseYear:
      type: integer
    genres:
      type: array
      items:
        type: string
        minLength: 1
    runtimeMinutes:
      type: integer
      minimum: 1
    synopsis:
      type: string
      minLength: 1
    rating:
      type: number
      minimum: 0
      maximum: 5
    _links:
      $ref: '#/MovieLinks'

MovieLinks:
  type: object
  required: [self]
  additionalProperties: false
  properties:
    self:
      $ref: './common.yaml#/Link'

MovieCollectionEnvelope:
  type: object
  required: [data, meta]
  additionalProperties: false
  properties:
    data:
      $ref: '#/MovieCollection'
    meta:
      $ref: './common.yaml#/Meta'

MovieCollection:
  type: object
  required: [_embedded, _links]
  additionalProperties: false
  properties:
    _embedded:
      $ref: '#/MovieCollectionEmbedded'
    _links:
      $ref: './common.yaml#/CollectionLinks'

MovieCollectionEmbedded:
  type: object
  required: [movies]
  additionalProperties: false
  properties:
    movies:
      type: array
      items:
        $ref: '#/MovieSummary'

MovieSummary:
  type: object
  required: [id, title, releaseYear, genres, _links]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
      minLength: 1
    releaseYear:
      type: integer
    genres:
      type: array
      items:
        type: string
        minLength: 1
    runtimeMinutes:
      type: integer
      minimum: 1
    rating:
      type: number
      minimum: 0
      maximum: 5
    _links:
      $ref: '#/MovieLinks'
