Meta:
  type: object
  required: [timestamp, correlationId]
  additionalProperties: false
  properties:
    timestamp:
      type: string
      format: date-time
    correlationId:
      type: string
      format: uuid
    pagination:
      $ref: '#/Pagination'

Pagination:
  type: object
  required: [page, size, totalElements, totalPages]
  additionalProperties: false
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
    size:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
    totalElements:
      type: integer
      format: int64
      minimum: 0
    totalPages:
      type: integer
      format: int32
      minimum: 0

PageLinks:
  type: object
  required: [self, first, last]
  additionalProperties: false
  properties:
    self:
      $ref: '#/Link'
    first:
      $ref: '#/Link'
    prev:
      $ref: '#/Link'
    next:
      $ref: '#/Link'
    last:
      $ref: '#/Link'

Link:
  type: object
  required: [href]
  additionalProperties: false
  properties:
    href:
      type: string
      format: uri
    templated:
      type: boolean
    title:
      type: string

Problem:
  type: object
  required: [type, title, status, code, correlationId]
  additionalProperties: false
  properties:
    type:
      type: string
      format: uri
    title:
      type: string
    status:
      type: integer
    detail:
      type: string
    instance:
      type: string
      format: uri
    code:
      type: string
    correlationId:
      type: string
      format: uuid
