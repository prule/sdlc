Envelope:
  type: object
  required: [data, meta]
  properties:
    data:
      description: The response payload.
    meta:
      $ref: '#/Meta'

Meta:
  type: object
  required: [timestamp, correlationId]
  properties:
    timestamp:
      type: string
      format: date-time
    correlationId:
      type: string
      format: uuid
    pagination:
      $ref: '#/Pagination'

Pagination:
  type: object
  required: [page, size, totalElements, totalPages]
  properties:
    page:
      type: integer
      minimum: 0
    size:
      type: integer
      minimum: 1
    totalElements:
      type: integer
      format: int64
    totalPages:
      type: integer

Link:
  type: object
  required: [href]
  properties:
    href:
      type: string
      format: uri
    templated:
      type: boolean
    title:
      type: string

PingLinks:
  type: object
  required: [self]
  properties:
    self:
      $ref: '#/Link'

SampleCollectionLinks:
  type: object
  required: [self]
  properties:
    self:
      $ref: '#/Link'
    first:
      $ref: '#/Link'
    last:
      $ref: '#/Link'
    prev:
      $ref: '#/Link'
    next:
      $ref: '#/Link'

SampleItemLinks:
  type: object
  required: [self]
  properties:
    self:
      $ref: '#/Link'

MovieLinks:
  type: object
  required: [self]
  properties:
    self:
      $ref: '#/Link'
    credits:
      $ref: '#/Link'

CreditsLinks:
  type: object
  required: [self]
  properties:
    self:
      $ref: '#/Link'

PersonLinks:
  type: object
  required: [self, credits]
  properties:
    self:
      $ref: '#/Link'
    credits:
      $ref: '#/Link'

MovieCollectionLinks:
  type: object
  required: [self]
  properties:
    self:
      $ref: '#/Link'
    first:
      $ref: '#/Link'
    last:
      $ref: '#/Link'
    prev:
      $ref: '#/Link'
    next:
      $ref: '#/Link'

PersonFilmographyLinks:
  type: object
  required: [self]
  properties:
    self:
      $ref: '#/Link'
    first:
      $ref: '#/Link'
    last:
      $ref: '#/Link'
    prev:
      $ref: '#/Link'
    next:
      $ref: '#/Link'

Problem:
  type: object
  required: [type, title, status, code, correlationId]
  properties:
    type:
      type: string
      format: uri
    title:
      type: string
    status:
      type: integer
    detail:
      type: string
    instance:
      type: string
      format: uri
    code:
      type: string
    correlationId:
      type: string
      format: uuid
    errors:
      type: array
      items:
        type: object
        required: [field, message]
        properties:
          field:
            type: string
          message:
            type: string
          code:
            type: string
