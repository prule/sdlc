openapi: 3.1.0
info:
  title: SDLC API
  description: Walking-skeleton API for the SDLC platform.
  version: 0.0.1
servers:
  - url: /api/v1
tags:
  - name: health
    description: Liveness and readiness endpoints.
  - name: sample
    description: >-
      Demonstrative, throwaway sample collection proving the HAL pagination-link
      convention. Not a real catalog capability.
  - name: movies
    description: Public, read-only catalog data for a single Movie.
  - name: people
    description: Public, read-only catalog data for a single Person.
security:
  - bearerAuth: []
paths:
  /ping:
    $ref: 'paths/health.yaml'
  /samples:
    $ref: 'paths/samples.yaml'
  /movies:
    $ref: 'paths/movies-collection.yaml'
  /movies/{id}:
    $ref: 'paths/movies.yaml'
  /movies/{id}/credits:
    $ref: 'paths/movie-credits.yaml'
  /people/{id}:
    $ref: 'paths/people.yaml'
  /people/{id}/credits:
    $ref: 'paths/person-filmography.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      $ref: 'components/schemas/common.yaml#/Envelope'
    Meta:
      $ref: 'components/schemas/common.yaml#/Meta'
    Pagination:
      $ref: 'components/schemas/common.yaml#/Pagination'
    Problem:
      $ref: 'components/schemas/common.yaml#/Problem'
    Link:
      $ref: 'components/schemas/common.yaml#/Link'
    PingLinks:
      $ref: 'components/schemas/common.yaml#/PingLinks'
    SampleCollectionLinks:
      $ref: 'components/schemas/common.yaml#/SampleCollectionLinks'
    SampleItemLinks:
      $ref: 'components/schemas/common.yaml#/SampleItemLinks'
    PingData:
      $ref: 'components/schemas/health.yaml#/PingData'
    PingEnvelope:
      $ref: 'components/schemas/health.yaml#/PingEnvelope'
    SampleItem:
      $ref: 'components/schemas/sample.yaml#/SampleItem'
    SampleCollectionData:
      $ref: 'components/schemas/sample.yaml#/SampleCollectionData'
    SampleCollectionEnvelope:
      $ref: 'components/schemas/sample.yaml#/SampleCollectionEnvelope'
    MovieLinks:
      $ref: 'components/schemas/common.yaml#/MovieLinks'
    MovieCollectionLinks:
      $ref: 'components/schemas/common.yaml#/MovieCollectionLinks'
    MovieSummaryLinks:
      $ref: 'components/schemas/common.yaml#/MovieSummaryLinks'
    MovieDetail:
      $ref: 'components/schemas/movie.yaml#/MovieDetail'
    MovieDetailEnvelope:
      $ref: 'components/schemas/movie.yaml#/MovieDetailEnvelope'
    MovieSummary:
      $ref: 'components/schemas/movie.yaml#/MovieSummary'
    MovieCollectionData:
      $ref: 'components/schemas/movie.yaml#/MovieCollectionData'
    MovieCollectionEnvelope:
      $ref: 'components/schemas/movie.yaml#/MovieCollectionEnvelope'
    MovieCreditsLinks:
      $ref: 'components/schemas/common.yaml#/MovieCreditsLinks'
    CreditPerson:
      $ref: 'components/schemas/credit.yaml#/CreditPerson'
    CastCredit:
      $ref: 'components/schemas/credit.yaml#/CastCredit'
    CrewCredit:
      $ref: 'components/schemas/credit.yaml#/CrewCredit'
    MovieCreditsData:
      $ref: 'components/schemas/credit.yaml#/MovieCreditsData'
    MovieCreditsEnvelope:
      $ref: 'components/schemas/credit.yaml#/MovieCreditsEnvelope'
    CreditPersonLinks:
      $ref: 'components/schemas/common.yaml#/CreditPersonLinks'
    PersonLinks:
      $ref: 'components/schemas/common.yaml#/PersonLinks'
    Person:
      $ref: 'components/schemas/person.yaml#/Person'
    PersonDetailEnvelope:
      $ref: 'components/schemas/person.yaml#/PersonDetailEnvelope'
    ActingCapacity:
      $ref: 'components/schemas/person.yaml#/ActingCapacity'
    NonActingCapacity:
      $ref: 'components/schemas/person.yaml#/NonActingCapacity'
    FilmographyCapacity:
      $ref: 'components/schemas/person.yaml#/FilmographyCapacity'
    FilmographyItem:
      $ref: 'components/schemas/person.yaml#/FilmographyItem'
    PersonFilmographyLinks:
      $ref: 'components/schemas/common.yaml#/PersonFilmographyLinks'
    PersonFilmographyData:
      $ref: 'components/schemas/person.yaml#/PersonFilmographyData'
    PersonFilmographyEnvelope:
      $ref: 'components/schemas/person.yaml#/PersonFilmographyEnvelope'
  responses:
    BadRequest:
      $ref: 'components/responses/common.yaml#/BadRequest'
    Unauthorized:
      $ref: 'components/responses/common.yaml#/Unauthorized'
    Forbidden:
      $ref: 'components/responses/common.yaml#/Forbidden'
    NotFound:
      $ref: 'components/responses/common.yaml#/NotFound'
    Conflict:
      $ref: 'components/responses/common.yaml#/Conflict'
    UnprocessableEntity:
      $ref: 'components/responses/common.yaml#/UnprocessableEntity'
    TooManyRequests:
      $ref: 'components/responses/common.yaml#/TooManyRequests'
    InternalError:
      $ref: 'components/responses/common.yaml#/InternalError'
  parameters:
    CorrelationId:
      $ref: 'components/parameters/common.yaml#/CorrelationId'
    Page:
      $ref: 'components/parameters/common.yaml#/Page'
    Size:
      $ref: 'components/parameters/common.yaml#/Size'
  headers:
    CorrelationId:
      $ref: 'components/headers/common.yaml#/CorrelationId'
