get:
  operationId: getMovieCredits
  tags: [movies]
  summary: Retrieve a movie's cast and crew credits
  description: >-
    Public, read-only retrieval of one movie's full cast and crew, returned
    whole (not paginated), as two separate embedded relations ordered by
    billing (cast) and department/job (crew).
  security: []
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/CorrelationId'
    - name: id
      in: path
      required: true
      description: The movie's stable, opaque identifier.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The movie's credits
      headers:
        X-Correlation-Id:
          $ref: '../openapi.yaml#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/MovieCreditsEnvelope'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
