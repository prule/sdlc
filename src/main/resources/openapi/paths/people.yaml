get:
  operationId: getPersonById
  tags: [people]
  summary: Retrieve a person's core details by id
  description: >-
    Public, read-only retrieval of one person's core details (identifier and
    name only) by their stable, opaque identifier.
  security: []
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/CorrelationId'
    - name: id
      in: path
      required: true
      description: The person's stable, opaque identifier.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The person's core details
      headers:
        X-Correlation-Id:
          $ref: '../openapi.yaml#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PersonDetailEnvelope'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
