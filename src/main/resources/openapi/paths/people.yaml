get:
  operationId: getPersonById
  tags: [people]
  summary: Retrieve a single Person's detail by id
  description: >-
    Public, read-only detail of a single Person by their stable opaque UUID. Exposes exactly
    id, name, and _links.
  security: []
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/CorrelationId'
    - name: id
      in: path
      required: true
      description: The Person's stable opaque UUID.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The person detail
      headers:
        X-Correlation-Id:
          $ref: '../openapi.yaml#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PersonDetailEnvelope'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
