get:
  operationId: listMovies
  tags: [movies]
  summary: Search/list movie summaries
  description: >-
    Public, read-only, paginated, sorted, and filtered collection of movie summary resources.
    Filters (title/genre/yearFrom/yearTo/minRating) combine with AND; an empty result set is a
    normal 200.
  security: []
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/CorrelationId'
    - $ref: '../openapi.yaml#/components/parameters/Page'
    - $ref: '../openapi.yaml#/components/parameters/Size'
    - name: title
      in: query
      required: false
      description: Case-insensitive substring match against the movie title.
      schema:
        type: string
    - name: genre
      in: query
      required: false
      description: >-
        Repeatable genre filter. When supplied more than once, a movie must carry ALL of the
        supplied genres to match (AND). An unknown/misspelled genre is not an error.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    - name: yearFrom
      in: query
      required: false
      description: Inclusive lower bound on release year.
      schema:
        type: integer
    - name: yearTo
      in: query
      required: false
      description: Inclusive upper bound on release year.
      schema:
        type: integer
    - name: minRating
      in: query
      required: false
      description: Inclusive minimum aggregate rating. Movies with no rating are excluded.
      schema:
        type: number
        minimum: 0
        maximum: 5
    - name: sort
      in: query
      required: false
      description: >-
        Sort as `<field>,<dir>` where field is one of title|releaseYear|rating and dir is
        asc|desc. Defaults to releaseYear,desc with a title ascending tiebreak. An unsupported
        field or direction is rejected with 400.
      schema:
        type: string
        default: releaseYear,desc
  responses:
    '200':
      description: A page of matching movie summaries
      headers:
        X-Correlation-Id:
          $ref: '../openapi.yaml#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/MovieCollectionEnvelope'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
