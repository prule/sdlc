ping:
  get:
    operationId: ping
    summary: Check that the catalog service is available
    description: >
      Public liveness check. Answers UP whenever the service process is
      running and able to handle HTTP requests, regardless of whether the
      catalog holds any data.
    tags:
      - Health
    security: []
    responses:
      '200':
        description: The service is available.
        headers:
          X-Correlation-Id:
            $ref: '../components/headers/common.yaml#/X-Correlation-Id'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/health.yaml#/PingEnvelope'
      '406':
        $ref: '../components/responses/common.yaml#/NotAcceptable'
      '500':
        $ref: '../components/responses/common.yaml#/InternalError'
