get:
  operationId: getMovieById
  tags: [movies]
  summary: Retrieve a single Movie's detail by id
  description: >-
    Public, read-only detail of a single Movie by its stable opaque UUID. Optional fields
    (runtimeMinutes, synopsis, rating) are omitted when absent.
  security: []
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/CorrelationId'
    - name: id
      in: path
      required: true
      description: The Movie's stable opaque UUID.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The movie detail
      headers:
        X-Correlation-Id:
          $ref: '../openapi.yaml#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/MovieDetailEnvelope'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
