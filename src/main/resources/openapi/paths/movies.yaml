movies:
  get:
    operationId: searchMovies
    summary: Search and browse movies
    description: >
      Returns one page of movie summaries matching every given criterion (all
      optional; none = browse the whole catalog). Default order: release year
      newest first, then title A–Z. Unrated movies always sort last when
      ordering by rating. A page after the last is an empty page, not an
      error. Navigation links repeat the request's criteria, order and size
      exactly as given.
    tags: [Movies]
    security: []
    parameters:
      - name: title
        in: query
        description: Case-insensitive "contains" match on the title. Blank = no criterion.
        schema: { type: string }
      - name: genre
        in: query
        description: >
          Curated genre name, case-insensitive. Repeat (or comma-separate) for
          several; a movie must carry all of them. Unknown genre = 400.
        style: form
        explode: true
        schema:
          type: array
          items: { type: string }
      - name: releaseYearFrom
        in: query
        description: Inclusive lower release-year bound.
        schema: { type: integer, format: int32 }
      - name: releaseYearTo
        in: query
        description: Inclusive upper release-year bound; must not be before releaseYearFrom.
        schema: { type: integer, format: int32 }
      - name: minRating
        in: query
        description: Inclusive minimum rating on the 0–5 scale; unrated movies are excluded.
        schema: { type: number, minimum: 0, maximum: 5 }
      - name: sort
        in: query
        description: Order; prefix "-" for descending. Default -releaseYear (then title A–Z).
        schema:
          type: string
          enum: [title, -title, releaseYear, -releaseYear, rating, -rating]
      - $ref: '../components/parameters/common.yaml#/page'
      - $ref: '../components/parameters/common.yaml#/size'
    responses:
      '200':
        description: One page of matching movie summaries.
        headers:
          X-Correlation-Id: { $ref: '../components/headers/common.yaml#/X-Correlation-Id' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/movie.yaml#/MovieSearchEnvelope' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '406': { $ref: '../components/responses/common.yaml#/NotAcceptable' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }

movie:
  get:
    operationId: getMovie
    summary: Retrieve a movie's details
    description: >
      Returns the curated details of one movie. `id` must be a canonical UUID
      (8-4-4-4-12 hex digits, any case); any other value is 400. Runtime,
      synopsis and rating are omitted when not recorded. In standalone mode
      (no profile), two sample movies are always available:
      `11111111-1111-4111-8111-111111111111` (every optional detail recorded)
      and `22222222-2222-4222-8222-222222222222` (no optional details and no
      genres). Persistent mode does not contain these samples.
    tags: [Movies]
    security: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: The movie's details.
        headers:
          X-Correlation-Id: { $ref: '../components/headers/common.yaml#/X-Correlation-Id' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/movie.yaml#/MovieEnvelope' }
      '400': { $ref: '../components/responses/common.yaml#/BadRequest' }
      '404': { $ref: '../components/responses/common.yaml#/NotFound' }
      '406': { $ref: '../components/responses/common.yaml#/NotAcceptable' }
      '500': { $ref: '../components/responses/common.yaml#/InternalError' }
