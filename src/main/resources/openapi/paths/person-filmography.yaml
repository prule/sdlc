get:
  operationId: getPersonFilmography
  tags: [people]
  summary: Retrieve a single Person's filmography (the movies they are credited in)
  description: >-
    Public, read-only, paginated filmography of a single Person by their stable opaque UUID.
    Carried as a single embedded relation (`filmography`, not split cast/crew); each item is a
    movie summary plus one typed capacity. A Person credited in several capacities on one Movie
    yields one item per capacity. Ordered by releaseYear desc, then title asc, then a unique
    terminal key.
  security: []
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/CorrelationId'
    - $ref: '../openapi.yaml#/components/parameters/Page'
    - $ref: '../openapi.yaml#/components/parameters/Size'
    - name: id
      in: path
      required: true
      description: The Person's stable opaque UUID.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: A page of the person's filmography
      headers:
        X-Correlation-Id:
          $ref: '../openapi.yaml#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PersonFilmographyEnvelope'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
