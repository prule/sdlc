get:
  operationId: getMovieCredits
  tags: [movies]
  summary: Retrieve a single Movie's cast and crew
  description: >-
    Public, read-only, unpaginated cast and crew of a single Movie by its stable opaque UUID.
    Cast and crew are carried as two separate embedded relations (`cast`, `crew`), each ordered
    and returned in full — no pagination.
  security: []
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/CorrelationId'
    - name: id
      in: path
      required: true
      description: The Movie's stable opaque UUID.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The movie's credits
      headers:
        X-Correlation-Id:
          $ref: '../openapi.yaml#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/MovieCreditsEnvelope'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
