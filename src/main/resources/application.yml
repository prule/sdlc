spring:
  application:
    name: sdlc
  # Global: omit absent optional JSON fields instead of serializing them as explicit `null`.
  # Idiomatic HAL (e.g. Link.templated/title, _links.prev/next) and keeps generated DTOs
  # conformant to their OpenAPI schema (no property is declared nullable). RFC 7807 Problem's
  # required members (type/title/status/code/correlationId) are always populated, so this does
  # not affect them; only genuinely-absent optional fields are dropped.
  jackson:
    default-property-inclusion: non_null
  # Default (no-profile) runtime: zero-dependency in-memory database, reset on each restart.
  # Activate the `postgres` profile (see application-postgres.yml) for the tested,
  # production-capable PostgreSQL target.
  datasource:
    url: jdbc:h2:mem:sdlc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration

# Custom namespace (not spring.security.oauth2.resourceserver.jwt.*) so Spring Boot's
# resource-server auto-configuration never activates; the JwtDecoder bean in SecurityConfig
# builds the decoder itself, composing the issuer defaults with an audience validator.
security:
  jwt:
    issuer-uri: ${OAUTH2_ISSUER_URI:}
    expected-audience: ${OAUTH2_EXPECTED_AUDIENCE:sdlc-api}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
