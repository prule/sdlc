spring:
  application:
    name: sdlc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sdlc}
    username: ${DB_USERNAME:sdlc}
    password: ${DB_PASSWORD:sdlc}
  flyway:
    enabled: true
    locations: classpath:db/migration

# Custom namespace (not spring.security.oauth2.resourceserver.jwt.*) so Spring Boot's
# resource-server auto-configuration never activates; the JwtDecoder bean in SecurityConfig
# builds the decoder itself, composing the issuer defaults with an audience validator.
security:
  jwt:
    issuer-uri: ${OAUTH2_ISSUER_URI:}
    expected-audience: ${OAUTH2_EXPECTED_AUDIENCE:sdlc-api}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
