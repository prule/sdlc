spring:
  application:
    name: sdlc
  # Global: omit absent optional JSON fields instead of serializing them as explicit `null`.
  # Idiomatic HAL (e.g. Link.templated/title, _links.prev/next) and keeps generated DTOs
  # conformant to their OpenAPI schema (no property is declared nullable). RFC 7807 Problem's
  # required members (type/title/status/code/correlationId) are always populated, so this does
  # not affect them; only genuinely-absent optional fields are dropped.
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Default (no-profile) runtime: zero-dependency in-memory database, reset on each restart.
  # Activate the `postgres` profile (see application-postgres.yml) for the tested,
  # production-capable PostgreSQL target.
  datasource:
    url: jdbc:h2:mem:sdlc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  # Trust X-Forwarded-* from the gateway: HSTS and self-link scheme/host follow the externally
  # visible request (see standards/security.md §2 and platform SecurityConfig).
  forward-headers-strategy: framework
  error:
    # ProblemErrorController renders every failure as problem+json; the default whitelabel HTML
    # error page is never used.
    whitelabel:
      enabled: false

# Actuator's HTTP surface (including its discovery root) is disabled entirely: there are no
# undocumented HTTP endpoints. The dependency stays on the classpath for future non-HTTP use.
management:
  server:
    port: -1

# Every log line includes the request's correlation id so a client-reported failure maps to
# server logs (platform CorrelationIdFilter).
logging:
  pattern:
    level: "%5p [%X{correlationId}]"
